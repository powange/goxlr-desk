name: Create Release Build
on: [ workflow_dispatch, workflow_call ]

# Builds only read the repository, artifacts are uploaded with the job token.
permissions:
  contents: read
jobs:
  get_version:
    name: "Version"
    uses: ./.github/workflows/get-version.yml

  build_windows:
    name: "Create Windows Build"
    strategy:
      # Build each architecture to the end, a failure on one shouldn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - targets: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: windows-artifact
            visual_c: https://aka.ms/vs/17/release/vc_redist.x64.exe
          - targets: aarch64-pc-windows-msvc
            runner: windows-11-arm
            artifact: windows-artifact-arm
            visual_c: https://aka.ms/vs/17/release/vc_redist.arm64.exe
    runs-on: ${{ matrix.runner }}
    needs: [ get_version ]
    steps:
      - name: Set architecture suffix
        id: arch_suffix
        shell: pwsh
        run: |
          if ("${{ matrix.targets }}" -eq "aarch64-pc-windows-msvc") {
            echo "SUFFIX=-arm64" >> $env:GITHUB_ENV
          } else {
            echo "SUFFIX=" >> $env:GITHUB_ENV
          }

      # Firstly Checkout our Repository..
      - name: "Check out GoXLR Desk"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: goxlr-utility

      # Now Checkout the App Wrappers repository..
      - name: "Check out the UI window (from GoXLR Utility)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: goxlr-on-linux/goxlr-utility-ui-wrapper-app
          # Pinned so a release always builds the same UI, update this to ship a newer UI.
          ref: e71bb2e33439ca832ee7f2cbd5b29e500e2a8596
          path: goxlr-utility-ui

      # The desktop app comes from GoXLR Utility's repository: made GoXLR Desk's (name, icons,
      # settings location). Also turns Tauri's drag and drop handler off, which otherwise stops
      # drag and drop inside the web UI on Windows (moving samples, dropping them on buttons).
      - name: "Make the UI window GoXLR Desk's"
        shell: bash
        run: |
          bash goxlr-utility/ci/rebrand-ui-wrapper.sh goxlr-utility-ui
          jq '{productName, identifier, window: .app.windows[0]}' goxlr-utility-ui/src-tauri/tauri.conf.json

      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: "Loading Cache"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            goxlr-utility/target
          key: ${{ runner.os }}-${{ matrix.targets }}-cargo-release-${{ hashFiles('goxlr-utility/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.targets }}-cargo-release-

      - name: "Build Utility"
        run: "cargo build --manifest-path=goxlr-utility/Cargo.toml --release --all-features"

      # Build the UI into the same target directory..
      - name: "Build UI"
        run: "cargo build --manifest-path=goxlr-utility-ui/src-tauri/Cargo.toml --target-dir=goxlr-utility/target --release"

      # Prepare NSIS
      # NSIS is installed here rather than with repolevedavaj/install-nsis: its fixed SourceForge
      # mirror returns a page instead of the installer on the GitHub runners. The installer is
      # checked against its SHA-256 before it runs.
      - name: Install NSIS
        shell: pwsh
        env:
          NSIS_VERSION: '3.11'
          NSIS_SHA256: '38d49f8fe09b1c332b01d0940e57b7258f4447733643273a01c59959ad9d3b0a'
        run: |
          $installer = "$env:RUNNER_TEMP\nsis-setup.exe"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/nsis-$env:NSIS_VERSION-setup.exe"
          $ok = $false
          for ($attempt = 1; $attempt -le 5 -and -not $ok; $attempt++) {
            # A wget user agent gets the file directly instead of SourceForge's download page.
            curl.exe --location --fail --silent --show-error --retry 3 --user-agent "Wget/1.21" --output $installer $url
            if ($LASTEXITCODE -eq 0) {
              $ok = (Get-FileHash $installer -Algorithm SHA256).Hash -eq $env:NSIS_SHA256
            }
            if (-not $ok) {
              Write-Host "Attempt $attempt didn't return the expected installer, retrying.."
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { throw "Unable to download NSIS $env:NSIS_VERSION" }

          $process = Start-Process $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($process.ExitCode)" }
          "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

          # The EnVar plugin, previously installed by the same action
          $plugin = "$env:RUNNER_TEMP\EnVar_plugin.zip"
          curl.exe --location --fail --silent --show-error --retry 3 --output $plugin https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip
          if ($LASTEXITCODE -ne 0) { throw "Unable to download the EnVar plugin" }
          Expand-Archive $plugin -DestinationPath "C:\Program Files (x86)\NSIS" -Force

      - name: "Preparing NSIS"
        run: mkdir -p ${{ github.workspace }}/NSIS_Plugins/x86-unicode/

      - name: "Downloading Tauri Utility Plugin"
        uses: suisei-cn/actions-download-file@818d6b7dc8fe73f2f924b6241f2b1134ca1377d9 # v1.6.0
        with:
          url: https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.1.1/nsis_tauri_utils.dll
          target: ${{ github.workspace }}/NSIS_Plugins/x86-unicode/

      - name: "Downloading WebView2 Bootstrapper"
        uses: suisei-cn/actions-download-file@818d6b7dc8fe73f2f924b6241f2b1134ca1377d9 # v1.6.0
        with:
          url: https://go.microsoft.com/fwlink/p/?LinkId=2124703
          filename: MicrosoftEdgeWebview2Setup.exe
          target: goxlr-utility/ci/nsis/

      - name: "Downloading VC Runtime"
        uses: suisei-cn/actions-download-file@818d6b7dc8fe73f2f924b6241f2b1134ca1377d9 # v1.6.0
        with:
          url: ${{ matrix.visual_c }}
          filename: vc_redist.exe
          target: goxlr-utility/ci/nsis/

      - name: "Build NSIS Packages"
        uses: joncloud/makensis-action@1446fc4d066482f715a57952550f559a3ab72b8a # publish branch
        with:
          additional-plugin-paths: ${{ github.workspace }}/NSIS_Plugins
          script-file: goxlr-utility/ci/nsis/goxlr-desk.nsi
          arguments: "/DPRODUCT_VERSION=${{ needs.get_version.outputs.version }}${{ env.SUFFIX }}"

      - name: "Upload Installer"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ./goxlr-utility/ci/Output/*.exe

  build_linux:
    name: "Create Linux Builds"
    runs-on: ubuntu-22.04
    needs: [ get_version ]
    steps:
      - name: "Check out Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: "Install Required Libraries"
        run: |
          sudo apt-get update
          sudo apt-get install libpulse0 libdbus-1-dev pkg-config libspeechd-dev

      - name: "Loading Cache"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install --locked --force cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: "Build Packages"
        run: ./ci/build-packages
        shell: bash

      - name: "Upload DEB Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debian-artifact
          path: ./target/debian/*.deb

      - name: "Upload RPM Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-artifact
          path: ./target/generate-rpm/*.rpm

  build_macos:
    name: "Create MacOS Builds"
    strategy:
      matrix:
        targets: [ x86_64-apple-darwin, aarch64-apple-darwin ]
    runs-on: macos-latest
    needs: [ get_version ]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: goxlr-utility

      # Now Checkout the App Wrappers repository..
      - name: "Check out the UI window (from GoXLR Utility)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: goxlr-on-linux/goxlr-utility-ui-wrapper-app
          # Pinned so a release always builds the same UI, update this to ship a newer UI.
          ref: e71bb2e33439ca832ee7f2cbd5b29e500e2a8596
          path: goxlr-utility-ui

      # The desktop app comes from GoXLR Utility's repository: made GoXLR Desk's (name, icons,
      # settings location). Also turns Tauri's drag and drop handler off, which otherwise stops
      # drag and drop inside the web UI on Windows (moving samples, dropping them on buttons).
      - name: "Make the UI window GoXLR Desk's"
        shell: bash
        run: |
          bash goxlr-utility/ci/rebrand-ui-wrapper.sh goxlr-utility-ui
          jq '{productName, identifier, window: .app.windows[0]}' goxlr-utility-ui/src-tauri/tauri.conf.json

      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: "Loading Cache"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            goxlr-utility/target
          key: ${{ runner.os }}-${{ matrix.targets }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.targets }}-cargo-release-

      - name: "Add rust target support"
        run: rustup target add ${{ matrix.targets }}

      - name: "Build Package"
        run: ./goxlr-utility/ci/build-macos '${{ matrix.targets }}' '${{ needs.get_version.outputs.version }}'
        shell: bash

      - name: "Upload MacOS zip Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-artifact-${{ matrix.targets }}
          path: ./macos_binaries_*.tgz

  package_macos:
    name: "Package MacOS Binaries"
    runs-on: macos-latest
    needs: [ get_version, build_macos ]

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Download x86_64 Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "macos-artifact-x86_64-apple-darwin"

      - name: "Download aarch64 Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "macos-artifact-aarch64-apple-darwin"

      - name: "Install Packages App.."
        # The download is plain HTTP and always the latest version, so the volume is mounted at a
        # fixed path (its name carries the version) and the installer's Developer ID signature is
        # checked before it runs as root.
        run: |
          wget http://s.sudre.free.fr/Software/files/Packages.dmg
          hdiutil attach Packages.dmg -nobrowse -mountpoint /Volumes/PackagesInstaller
          pkg=$(find /Volumes/PackagesInstaller -maxdepth 1 -name "*.pkg" | head -n 1)
          test -n "$pkg"
          pkgutil --check-signature "$pkg" | tee signature.txt
          grep -q "Status: signed by a developer certificate issued by Apple" signature.txt
          grep -q "Developer ID Installer: Stephane Sudre (NL5M9E394P)" signature.txt
          sudo installer -pkg "$pkg" -target /
      - name: "Build LIPO Binaries"
        run: ./ci/build-macos-package '${{ needs.get_version.outputs.version }}'
        shell: bash

      - name: "Upload MacOS final Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-artifact
          path: ./goxlr-desk-macos-*.pkg

      - name: "Remove x64 artifact"
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: macos-artifact-x86_64-apple-darwin

      - name: "Remove aarch artifact"
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: macos-artifact-aarch64-apple-darwin
