# cargo-deny configuration, used by the CI job that checks dependencies against the RustSec
# advisory database (`cargo deny check advisories`). Any new vulnerability fails the build.

[advisories]
# Crates flagged as unmaintained, with no known vulnerability. Each one stays listed here until it
# can be removed or replaced, remove the entry once that's done.
ignore = [
    { id = "RUSTSEC-2021-0139", reason = "ansi_term: build-time only, clap 2 via bindgen 0.58 for the macOS xpc-connection-sys" },
    { id = "RUSTSEC-2024-0375", reason = "atty: build-time only, clap 2 via bindgen 0.58 for the macOS xpc-connection-sys" },
    { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro used by dependencies of the image crate" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: used by ab_glyph to render scribbles" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: part of zbus (D-Bus on Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: part of zbus (D-Bus on Linux)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: part of zbus (D-Bus on Linux)" },
]
