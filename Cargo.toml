[workspace]
resolver = "2"

members = [
    "launcher",
    "usb",
    "daemon",
    "audio",
    "client",
    "ipc",
    "types",
    "profile",
    "initialiser",
    "scribbles",
    "defaults",
]

[workspace.package]
version = "1.2.4"
edition = "2024"
# Edition 2024 with let-chains needs Rust 1.88 or newer.
rust-version = "1.88"

authors = ["Nathan Adams <dinnerbone@dinnerbone.com>", "Craig McLure <craig@mclure.net>", "Lars Mühlbauer <lm41@dismail.de>"]
license = "MIT"

repository = "https://github.com/GoXLR-on-Linux/GoXLR-Utility"

# The lint policy lives here, not only on the CI command line, so a local `cargo clippy` sees the
# same thing (CI still adds `-D warnings` to turn them into errors).
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
log = "0.4.28"

### Error Handling
anyhow = "1.0.100"
thiserror = "2.0.17"

### Serialing / Deserialising
strum = { version = "0.27.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }

### JSON Handling
schemars = "1.2.3"
serde_json = { version = "1.0.145" }
json-patch = "4.1.0"

### Async Handling
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"

### Enums
enumset = "1.1.10"
enum-map = { version = "2.7.3", features = ["serde"] }

### Messaging
interprocess = { version = "2.2.3", features = ["tokio"] }
byteorder = "1.5.0"

### CLI Parameter Handling
clap = { version = "4.5.48", features = ["derive"] }
clap_complete = "4.5.58"

### Directory Inclusion
include_dir = "0.7.4"

### Image Manipulation
image = "0.25.8"

### CFG handler
cfg-if = "1.0.3"

### USB Handler
rusb = "0.9.4"

### Lazy Statics

### Regular Expressions
fancy-regex = "0.16.2"

### Locate a binary on $PATH
which = "8.0.0"

### Web Requests
reqwest = { version = "0.12.23", default-features = false }

### System Info
sysinfo = "0.37.2"

### Windows Specific
windows = "0.62.2"
winreg = "0.55.0"
embed-resource = "3.0.12"

### Linux Specific
nix = "0.30.1"
